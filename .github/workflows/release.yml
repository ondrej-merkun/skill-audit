name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for npm trusted publishing / provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Do NOT use any cache on purpose
          # it increases the chance of a compromised release being published
          # see https://github.com/actions/setup-node/issues/1445
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check clean build output
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/skill-audit-build.log
          if grep -iE 'warn|error' /tmp/skill-audit-build.log; then
            exit 1
          fi

      - name: Smoke built CLI
        run: node packages/cli/dist/index.js --help

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Publish skill-audit
        # No NODE_AUTH_TOKEN: npm uses GitHub OIDC trusted publishing when configured.
        run: npm publish --access public
        working-directory: packages/cli
