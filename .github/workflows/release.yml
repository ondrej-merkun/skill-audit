name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for npm trusted publishing / provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version that packageManager in package.json pins.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Do NOT use any cache on purpose
          # it increases the chance of a compromised release being published
          # see https://github.com/actions/setup-node/issues/1445
          registry-url: https://registry.npmjs.org

      # Use the npm bundled with Node. Installing npm here would run an unpinned
      # download while the job holds id-token: write.
      - name: Check npm supports trusted publishing
        env:
          # https://docs.npmjs.com/trusted-publishers
          MIN_NPM_VERSION: 11.5.1
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e '
            const [actual, minimum] = process.argv.slice(1);

            // Fail closed: a prerelease or unexpected output cannot be compared safely.
            if (!/^\d+\.\d+\.\d+$/.test(actual)) {
              console.error(`Cannot read npm version "${actual}": expected a plain x.y.z version.`);
              process.exit(1);
            }

            const actualParts = actual.split(".").map(Number);
            const minimumParts = minimum.split(".").map(Number);

            // The first part that differs decides which version is older.
            const index = actualParts.findIndex((part, i) => part !== minimumParts[i]);
            if (index !== -1 && actualParts[index] < minimumParts[index]) {
              console.error(`npm ${actual} is too old: trusted publishing needs npm ${minimum} or later.`);
              process.exit(1);
            }
          ' "$NPM_VERSION" "$MIN_NPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check clean build output
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/skill-audit-build.log
          if grep -iE 'warn|error' /tmp/skill-audit-build.log; then
            exit 1
          fi

      - name: Smoke built CLI
        run: node packages/cli/dist/index.js --help

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Publish skill-audit
        # No NODE_AUTH_TOKEN: npm uses GitHub OIDC trusted publishing when configured.
        run: npm publish --access public
        working-directory: packages/cli
