name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for npm trusted publishing / provenance

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check clean build output
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/skillaudit-build.log
          if grep -iE 'warn|error' /tmp/skillaudit-build.log; then
            exit 1
          fi

      - name: Smoke built CLI
        run: node packages/cli/dist/index.js --help

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Publish skill-audit
        # No NODE_AUTH_TOKEN: npm uses GitHub OIDC trusted publishing when configured.
        run: npm publish --access public
        working-directory: packages/cli
