<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">skill-audit terminal demo</title>
  <desc id="desc">A terminal screenshot showing skill-audit scan --offline --agent claude-code and the current risk-first verdict table output.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1000" height="540" fill="#f8fafc"/>
  <g filter="url(#shadow)">
    <rect x="50" y="34" width="900" height="472" rx="14" fill="url(#screen)"/>
    <rect x="50" y="34" width="900" height="42" rx="14" fill="#0f172a"/>
    <rect x="50" y="62" width="900" height="14" fill="#0f172a"/>
    <circle cx="80" cy="55" r="6" fill="#ef4444"/>
    <circle cx="101" cy="55" r="6" fill="#f59e0b"/>
    <circle cx="122" cy="55" r="6" fill="#22c55e"/>
    <text x="500" y="60" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#94a3b8">skill-audit</text>
  </g>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15">
    <text x="82" y="108" fill="#22c55e">$</text>
    <text x="104" y="108" fill="#e5e7eb">skill-audit scan --offline --agent claude-code</text>

    <text x="82" y="140" fill="#fbbf24">[skill-audit] offline mode - enrichment skipped</text>

    <rect x="82" y="162" width="836" height="58" rx="6" fill="#020617" stroke="#334155"/>
    <text x="105" y="198" fill="#e5e7eb">skill-audit  scanned 3 skills across 1 agent in 0.0s</text>

    <text x="92" y="254" fill="#93c5fd" font-weight="700">AGENT</text>
    <text x="248" y="254" fill="#93c5fd" font-weight="700">SKILL</text>
    <text x="520" y="254" fill="#93c5fd" font-weight="700">VERDICT</text>
    <text x="623" y="254" fill="#93c5fd" font-weight="700">SCORE</text>
    <text x="650" y="254" fill="#93c5fd" font-weight="700">TOP ISSUE</text>
    <line x1="92" y1="268" x2="908" y2="268" stroke="#334155"/>

    <text x="92" y="300" fill="#cbd5e1">Claude Code</text>
    <circle cx="251" cy="295" r="6" fill="#ef4444"/>
    <text x="268" y="300" fill="#fca5a5">obfuscated-eval-skill</text>
    <text x="520" y="300" fill="#f87171" font-weight="700">FAIL</text>
    <text x="623" y="300" fill="#f87171" font-weight="700">50</text>
    <text x="650" y="300" fill="#fca5a5" font-size="12">codeexec-js-eval-function (minify.js:10)</text>

    <text x="92" y="336" fill="#cbd5e1">Claude Code</text>
    <circle cx="251" cy="331" r="6" fill="#ef4444"/>
    <text x="268" y="336" fill="#fca5a5">webhook-exfil-skill</text>
    <text x="520" y="336" fill="#f87171" font-weight="700">FAIL</text>
    <text x="623" y="336" fill="#f87171" font-weight="700">75</text>
    <text x="650" y="336" fill="#fca5a5" font-size="12">net-webhook-known (notify.py:5)</text>

    <text x="92" y="372" fill="#cbd5e1">Claude Code</text>
    <circle cx="251" cy="367" r="6" fill="#22c55e"/>
    <text x="268" y="372" fill="#86efac">csv-processor</text>
    <text x="520" y="372" fill="#4ade80" font-weight="700">PASS</text>
    <text x="623" y="372" fill="#4ade80" font-weight="700">100</text>
    <text x="650" y="372" fill="#94a3b8">-</text>

    <line x1="92" y1="400" x2="908" y2="400" stroke="#334155"/>
    <text x="92" y="430" fill="#e5e7eb">Skills scanned............ 3</text>
    <text x="92" y="454" fill="#e5e7eb">Compromised skills........ 2   (67% of installed)</text>

    <text x="92" y="486" fill="#bfdbfe">-&gt; skill-audit explain obfuscated-eval-skill</text>
    <text x="470" y="486" fill="#e5e7eb">See full findings</text>
  </g>
</svg>
