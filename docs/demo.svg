<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">skill-audit terminal demo</title>
  <desc id="desc">A terminal screenshot showing skill-audit scan with current risk-first scan results across Claude Code, Codex, and GitHub Copilot.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <clipPath id="terminal-body">
      <rect x="78" y="94" width="844" height="456"/>
    </clipPath>
    <clipPath id="issue-column">
      <rect x="654" y="246" width="274" height="118"/>
    </clipPath>
  </defs>

  <rect width="1000" height="640" fill="#f8fafc"/>
  <g filter="url(#shadow)">
    <rect x="50" y="34" width="900" height="572" rx="14" fill="url(#screen)"/>
    <rect x="50" y="34" width="900" height="42" rx="14" fill="#0f172a"/>
    <rect x="50" y="62" width="900" height="14" fill="#0f172a"/>
    <circle cx="80" cy="55" r="6" fill="#ef4444"/>
    <circle cx="101" cy="55" r="6" fill="#f59e0b"/>
    <circle cx="122" cy="55" r="6" fill="#22c55e"/>
  </g>

  <g clip-path="url(#terminal-body)" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="82" y="108" fill="#22c55e">$</text>
    <text x="104" y="108" fill="#e5e7eb">skill-audit scan</text>

    <rect x="82" y="142" width="836" height="58" rx="6" fill="#020617" stroke="#334155"/>
    <text x="104" y="178" fill="#e5e7eb">skill-audit  scanned 3 skills across 3 agents in 0.2s</text>

    <text x="92" y="246" fill="#93c5fd" font-weight="700">AGENT</text>
    <text x="270" y="246" fill="#93c5fd" font-weight="700">SKILL</text>
    <text x="526" y="246" fill="#93c5fd" font-weight="700">VERDICT</text>
    <text x="616" y="246" fill="#93c5fd" font-weight="700">SCORE</text>
    <text x="688" y="246" fill="#93c5fd" font-weight="700">TOP ISSUE</text>
    <line x1="92" y1="260" x2="908" y2="260" stroke="#334155"/>

    <text x="92" y="292" fill="#cbd5e1">Claude Code</text>
    <circle cx="255" cy="287" r="6" fill="#ef4444"/>
    <text x="270" y="292" fill="#fca5a5">obfuscated-eval</text>
    <text x="526" y="292" fill="#f87171" font-weight="700">FAIL</text>
    <text x="616" y="292" fill="#f87171" font-weight="700">50</text>
    <g clip-path="url(#issue-column)">
      <text x="688" y="292" fill="#fca5a5" font-size="12">js-eval-function (minify.js:10)</text>
    </g>

    <text x="92" y="328" fill="#cbd5e1">Codex</text>
    <circle cx="255" cy="323" r="6" fill="#facc15"/>
    <text x="270" y="328" fill="#fde68a">webhook-exfil</text>
    <text x="526" y="328" fill="#facc15" font-weight="700">REVIEW</text>
    <text x="616" y="328" fill="#facc15" font-weight="700">75</text>
    <g clip-path="url(#issue-column)">
      <text x="688" y="328" fill="#fde68a" font-size="12">webhook-exfil (notify.py:5)</text>
    </g>

    <text x="92" y="364" fill="#cbd5e1">GitHub Copilot</text>
    <circle cx="255" cy="359" r="6" fill="#22c55e"/>
    <text x="270" y="364" fill="#86efac">csv-processor</text>
    <text x="526" y="364" fill="#4ade80" font-weight="700">PASS</text>
    <text x="616" y="364" fill="#4ade80" font-weight="700">100</text>
    <text x="688" y="364" fill="#94a3b8">&#8212;</text>

    <line x1="92" y1="392" x2="908" y2="392" stroke="#334155"/>
    <text x="92" y="422" fill="#e5e7eb">Unique issues............. 2  (1 critical, 1 high, 0 medium, 0 low)</text>
    <text x="92" y="450" fill="#e5e7eb">Compromised skills........ 1   (33% of installed)</text>
  </g>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13">
    <text x="82" y="524" fill="#bfdbfe">&#8594; skill-audit explain obfuscated-eval</text>
    <text x="430" y="524" fill="#94a3b8">See full findings</text>
    <text x="82" y="548" fill="#bfdbfe">&#8594; skill-audit scan --llm local</text>
    <text x="368" y="548" fill="#94a3b8">Add local LLM review</text>
    <text x="82" y="572" fill="#bfdbfe">&#8594; skill-audit ignore &lt;skill&gt;</text>
    <text x="352" y="572" fill="#94a3b8">Allowlist a false positive</text>
    <text x="82" y="596" fill="#bfdbfe">&#8594; skill-audit --html report.html</text>
    <text x="396" y="596" fill="#94a3b8">Generate shareable HTML</text>
  </g>
</svg>
