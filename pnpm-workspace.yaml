packages:
  - 'packages/*'

# Do not run the esbuild postinstall script. esbuild comes in as an optional
# peer of vite (through vitest). Its JavaScript API loads the binary from the
# esbuild platform package. The script checks that binary, downloads it outside
# the lockfile when the platform package is missing, and makes the esbuild CLI
# start faster. pnpm installs the platform package, so the script is not needed.
# strictDepBuilds is on by default, so an install fails when a dependency has a
# build script that this list does not name.
allowBuilds:
  esbuild: false

# Keep pnpm-lock.yaml as one YAML document. Otherwise, pnpm 12 adds a
# package-manager document at the top of the lockfile. The GitHub dependency
# graph then finds no dependencies, and Dependabot alerts stop:
# https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
# CI and release still install the exact packageManager version through
# pnpm/action-setup. A local pnpm 11 or 12 does not switch versions.
pmOnFail: ignore

# Keep the defaults minimumReleaseAge (1 day) and trustLockfile (false). pnpm 12
# also checks existing lockfile entries against the release age, so CI fails for
# up to one day after a bump to a fresh release. Wait and re-run CI. Do not
# loosen these settings to make CI pass.
