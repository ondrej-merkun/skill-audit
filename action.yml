name: 'skillaudit'
description: 'Scan AI agent skills (Claude Code, Cursor, Copilot, Codex, Gemini, Windsurf, Cline) for prompt injection and malicious code.'
author: 'Ondrej Merkun'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  version:
    description: 'skill-audit npm package version to run (e.g. "0.1.0" or "latest")'
    required: false
    default: 'latest'
  path:
    description: 'Working directory to scan (default: repo root)'
    required: false
    default: '.'
  args:
    description: 'Additional arguments passed verbatim to `skillaudit scan`'
    required: false
    default: ''
  fail-on:
    description: 'Exit 1 when any result meets this verdict band or worse. One of: review, fail'
    required: false
    default: 'fail'
  agent:
    description: 'Restrict discovery to one agent id (claude-code, cursor, copilot, cross-agent). Leave blank for all agents.'
    required: false
    default: ''
  offline:
    description: 'Skip enrichment network calls (skills.sh, GitHub, deps.dev)'
    required: false
    default: 'false'
  upload-results:
    description: 'Upload JSON results as a workflow artifact'
    required: false
    default: 'true'
  results-file:
    description: 'Path where the JSON results file is written'
    required: false
    default: 'skillaudit-results.json'

outputs:
  results-file:
    description: 'Path to the JSON results file'
    value: ${{ steps.scan.outputs.results-file }}
  verdict:
    description: 'Worst verdict across all scanned skills (PASS, REVIEW, FAIL)'
    value: ${{ steps.scan.outputs.verdict }}

runs:
  using: 'composite'
  steps:
    - name: Scan skills
      id: scan
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SA_VERSION: ${{ inputs.version }}
        SA_AGENT: ${{ inputs.agent }}
        SA_OFFLINE: ${{ inputs.offline }}
        SA_FAIL_ON: ${{ inputs.fail-on }}
        SA_ARGS: ${{ inputs.args }}
        SA_RESULTS_FILE: ${{ inputs.results-file }}
      run: |
        set +e

        # Build optional flags — all values come from env vars, never from
        # direct template interpolation, to prevent shell injection (CWE-78).
        AGENT_FLAG=""
        if [ -n "$SA_AGENT" ]; then
          AGENT_FLAG="--agent"
        fi

        OFFLINE_FLAG=""
        if [ "$SA_OFFLINE" = "true" ]; then
          OFFLINE_FLAG="--offline"
        fi

        # Run scan and write JSON output to the requested file.
        # SA_ARGS is intentionally word-split here (extra flags from caller).
        # shellcheck disable=SC2086
        npx --yes "skill-audit@${SA_VERSION}" scan \
          --json \
          --output "$SA_RESULTS_FILE" \
          --fail-on "$SA_FAIL_ON" \
          ${AGENT_FLAG:+--agent "$SA_AGENT"} \
          $OFFLINE_FLAG \
          $SA_ARGS \
          2>skillaudit-stderr.txt
        EXIT_CODE=$?

        # Surface stderr so it shows in the step log
        if [ -s skillaudit-stderr.txt ]; then
          cat skillaudit-stderr.txt >&2
          rm skillaudit-stderr.txt
        fi

        # Extract worst verdict for the output variable.
        VERDICT="PASS"
        if command -v jq &>/dev/null && [ -f "$SA_RESULTS_FILE" ]; then
          VERDICT=$(jq -r '.summary.verdict // "PASS"' "$SA_RESULTS_FILE" 2>/dev/null || echo "PASS")
        fi

        echo "results-file=$SA_RESULTS_FILE" >> "$GITHUB_OUTPUT"
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE

    - name: Upload results artifact
      if: ${{ inputs.upload-results == 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: skillaudit-results
        path: ${{ inputs.path }}/${{ inputs.results-file }}
        if-no-files-found: warn
