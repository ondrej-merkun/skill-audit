name: 'skill-audit'
description: 'Scan AI agent skills (Claude Code, Cursor, Copilot, Codex, Gemini, Windsurf, Cline) for prompt injection and malicious code.'
author: 'Ondrej Merkun'
branding:
  icon: shield
  color: red

inputs:
  version:
    description: '@ondrej-merkun/skill-audit npm package version to run. The default is the CLI version that this action revision ships. Set "latest" to run the newest npm release.'
    required: false
    # Pinned so that the action ref also identifies the CLI package version that
    # runs. The CLI runtime dependencies still resolve within their semver ranges.
    # Keep equal to packages/cli/package.json (test/version-pins.test.ts).
    default: '0.2.1'
  path:
    description: 'Working directory for the scan and the results file (default: repo root)'
    required: false
    default: '.'
  scan-path:
    description: 'Skill directory, skills directory, or file to scan, relative to `path`. Set it to audit skills in the checkout before anyone installs them. Leave blank to scan the installed and project skills.'
    required: false
    default: ''
  args:
    description: 'Additional arguments passed verbatim to `skill-audit scan`'
    required: false
    default: ''
  fail-on:
    description: 'Exit 1 when any result meets this verdict band or worse. One of: review, fail (case-insensitive). Any other value fails the step with exit code 2.'
    required: false
    default: 'fail'
  agent:
    description: 'Restrict discovery to one agent id (claude-code, cursor, copilot, cross-agent). Leave blank for all agents.'
    required: false
    default: ''
  upload-results:
    description: 'Upload JSON results as a workflow artifact'
    required: false
    default: 'true'
  results-file:
    description: 'Path where the JSON results file is written'
    required: false
    default: 'skill-audit-results.json'
  sarif-file:
    description: 'Path where a SARIF 2.1.0 file for GitHub code scanning is written. Leave blank to skip SARIF. Upload the file with github/codeql-action/upload-sarif.'
    required: false
    default: ''

outputs:
  results-file:
    description: 'Path to the JSON results file, or blank when the CLI wrote no results file: the scan found no skills, or the CLI stopped with an error. After an incomplete scan (exit code 3), the file has only the skills that the scan checked.'
    value: ${{ steps.scan.outputs.results-file }}
  sarif-file:
    description: 'Path to the SARIF file, or blank when the sarif-file input is blank, the scan was incomplete (exit code 3), or the CLI stopped with an error'
    value: ${{ steps.scan.outputs.sarif-file }}
  verdict:
    description: 'Worst verdict across all scanned skills (PASS, REVIEW, FAIL). PASS when the scan found no skills. Blank when the scan was incomplete (exit code 3) or the CLI stopped with an error, for example a usage error (exit code 2).'
    value: ${{ steps.scan.outputs.verdict }}

runs:
  using: 'composite'
  steps:
    - name: Scan skills
      id: scan
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SA_VERSION: ${{ inputs.version }}
        SA_AGENT: ${{ inputs.agent }}
        SA_SCAN_PATH: ${{ inputs.scan-path }}
        SA_FAIL_ON: ${{ inputs.fail-on }}
        SA_ARGS: ${{ inputs.args }}
        SA_RESULTS_FILE: ${{ inputs.results-file }}
        SA_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set +e

        # Build optional flags — all values come from env vars, never from
        # direct template interpolation, to prevent shell injection (CWE-78).
        AGENT_FLAG=""
        if [ -n "$SA_AGENT" ]; then
          AGENT_FLAG="--agent"
        fi

        # Remove the files of an earlier run, so that the outputs describe only this scan.
        rm -f -- "$SA_RESULTS_FILE" ${SA_SARIF_FILE:+"$SA_SARIF_FILE"}

        # Run scan and write JSON output (and SARIF, if requested) to the requested files.
        # SA_ARGS is intentionally word-split here (extra flags from caller).
        # shellcheck disable=SC2086
        npx --yes "@ondrej-merkun/skill-audit@${SA_VERSION}" scan \
          ${SA_SCAN_PATH:+"$SA_SCAN_PATH"} \
          --json \
          --output "$SA_RESULTS_FILE" \
          --fail-on "$SA_FAIL_ON" \
          ${AGENT_FLAG:+--agent "$SA_AGENT"} \
          ${SA_SARIF_FILE:+--sarif "$SA_SARIF_FILE"} \
          $SA_ARGS \
          2>skill-audit-stderr.txt
        EXIT_CODE=$?

        # Surface stderr so it shows in the step log
        if [ -s skill-audit-stderr.txt ]; then
          cat skill-audit-stderr.txt >&2
          rm skill-audit-stderr.txt
        fi

        # The CLI writes no results file when the scan finds no skills or when it stops with an error.
        RESULTS_OUTPUT=""
        if [ -f "$SA_RESULTS_FILE" ]; then RESULTS_OUTPUT="$SA_RESULTS_FILE"; fi

        # Only a finished scan (exit code 0 or 1) has a verdict. Exit code 3 means that the scan
        # missed skills, and any other code means that the CLI stopped with an error.
        # Node reads the file because npx needs Node, and a runner can lack jq.
        VERDICT=""
        if [ -n "$RESULTS_OUTPUT" ] && { [ "$EXIT_CODE" -eq 0 ] || [ "$EXIT_CODE" -eq 1 ]; }; then
          VERDICT=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).summary.verdict)' "$SA_RESULTS_FILE" 2>/dev/null)
        elif [ "$EXIT_CODE" -eq 0 ]; then
          # Exit code 0 without a results file: the scan found no skills.
          VERDICT="PASS"
        fi

        echo "results-file=$RESULTS_OUTPUT" >> "$GITHUB_OUTPUT"
        # An incomplete scan writes no SARIF file, so the output stays blank and no upload runs.
        SARIF_OUTPUT=""
        if [ -n "$SA_SARIF_FILE" ] && [ -f "$SA_SARIF_FILE" ]; then SARIF_OUTPUT="$SA_SARIF_FILE"; fi
        echo "sarif-file=$SARIF_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

        exit $EXIT_CODE

    - name: Upload results artifact
      if: ${{ inputs.upload-results == 'true' && always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: skill-audit-results
        path: ${{ inputs.path }}/${{ inputs.results-file }}
        if-no-files-found: warn
